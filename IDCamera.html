<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Student ID Scanner
  </title>


  <style>

    *{
      box-sizing:border-box;
    }


    body{

      margin:0;

      min-height:100vh;

      padding:18px;

      background:#f4f7fb;

      font-family:Arial,sans-serif;

      color:#172033;

      display:flex;

      align-items:center;

      justify-content:center;

    }


    .card{

      width:100%;

      max-width:620px;

      background:#fff;

      border-radius:20px;

      padding:20px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,.12);

      text-align:center;

    }


    h1{

      margin:
        0 0 8px;

    }


    .muted{

      color:#667085;

      font-size:14px;

      line-height:1.4;

    }


    /*
     * ==========================================================
     * CAMERA
     * ==========================================================
     */

    .camera-wrap{

      position:relative;

      width:100%;

      max-width:420px;

      aspect-ratio:3 / 4;

      margin:20px auto;

      overflow:hidden;

      border-radius:18px;

      background:#111827;

    }


    #video{

      position:absolute;

      inset:0;

      width:100%;

      height:100%;

      object-fit:cover;

      display:block;

    }


    #capturedImage{

      position:absolute;

      inset:0;

      width:100%;

      height:100%;

      object-fit:contain;

      background:#111827;

      display:none;

    }


    /*
     * Scanner guide
     *
     * This is ONLY a guide.
     * Actual crop comes from detected
     * document boundaries.
     */

    .scanner-guide{

      position:absolute;

      left:50%;

      top:50%;

      width:70%;

      aspect-ratio:3 / 4;

      transform:
        translate(-50%,-50%);

      border:

        3px solid

        rgba(
          255,
          255,
          255,
          .95
        );

      border-radius:14px;

      pointer-events:none;

      box-shadow:

        0 0 0 9999px

        rgba(
          0,
          0,
          0,
          .30
        );

      transition:
        border-color .2s ease;

    }


    .scanner-guide.detected{

      border-color:
        #22c55e;

    }


    .corner{

      position:absolute;

      width:26px;

      height:26px;

      border:

        4px solid white;

    }


    .corner.tl{

      top:-3px;

      left:-3px;

      border-right:0;

      border-bottom:0;

      border-radius:
        8px 0 0 0;

    }


    .corner.tr{

      top:-3px;

      right:-3px;

      border-left:0;

      border-bottom:0;

      border-radius:
        0 8px 0 0;

    }


    .corner.bl{

      bottom:-3px;

      left:-3px;

      border-right:0;

      border-top:0;

      border-radius:
        0 0 0 8px;

    }


    .corner.br{

      bottom:-3px;

      right:-3px;

      border-left:0;

      border-top:0;

      border-radius:
        0 0 8px 0;

    }


    /*
     * ==========================================================
     * STATUS
     * ==========================================================
     */

    .instruction{

      font-weight:800;

      font-size:15px;

      margin-top:10px;

    }


    .status{

      margin-top:8px;

      min-height:20px;

      font-size:13px;

      color:#667085;

    }


    .error{

      display:none;

      margin-top:14px;

      padding:12px;

      border-radius:10px;

      background:#fee2e2;

      color:#991b1b;

      font-size:14px;

    }


    /*
     * ==========================================================
     * BUTTONS
     * ==========================================================
     */

    .actions{

      display:flex;

      justify-content:center;

      gap:10px;

      flex-wrap:wrap;

      margin-top:16px;

    }


    button{

      border:0;

      border-radius:10px;

      padding:

        12px 18px;

      font-size:15px;

      font-weight:800;

      cursor:pointer;

    }


    .secondary{

      background:#e5e7eb;

      color:#172033;

    }


    .success{

      background:#15803d;

      color:white;

    }


    button:disabled{

      opacity:.45;

      cursor:not-allowed;

    }


    /*
     * ==========================================================
     * RESULT
     * ==========================================================
     */

    .result-label{

      display:none;

      margin-top:14px;

      font-weight:800;

      color:#166534;

    }

  </style>

</head>


<body>


<div class="card">


  <h1>
    Student ID Scanner
  </h1>


  <p class="muted">

    Hold your physical Student ID vertically
    in the center. The scanner will automatically
    detect the card and capture it.

  </p>


  <div class="camera-wrap">


    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>


    <img
      id="capturedImage"
      alt="Scanned Student ID"
    >


    <div
      id="scannerGuide"
      class="scanner-guide"
    >

      <span
        class="corner tl"
      ></span>

      <span
        class="corner tr"
      ></span>

      <span
        class="corner bl"
      ></span>

      <span
        class="corner br"
      ></span>

    </div>

  </div>


  <div
    id="instruction"
    class="instruction"
  >
    Starting camera...
  </div>


  <div
    id="status"
    class="status"
  >
    Position your ID inside the guide.
  </div>


  <div
    id="resultLabel"
    class="result-label"
  >
    ✓ Student ID captured. Review the scan.
  </div>


  <div class="actions">


    <button
      id="retakeButton"
      class="secondary"
      style="display:none;"
      onclick="retakeScan()"
    >
      Retake
    </button>


    <button
      id="useButton"
      class="success"
      style="display:none;"
      onclick="useScan()"
    >
      Use This ID
    </button>

  </div>


  <div
    id="error"
    class="error"
  ></div>


</div>


<script>

/*
 * ==========================================================
 * GLOBALS
 * ==========================================================
 */

let stream = null;

let cvReady = false;

let scanning = false;

let scanTimer = null;

let lastDetection = null;

let stableFrames = 0;

let autoCaptured = false;

let capturedData = null;


/*
 * ==========================================================
 * ELEMENTS
 * ==========================================================
 */

const video =
  document.getElementById(
    'video'
  );


const capturedImage =
  document.getElementById(
    'capturedImage'
  );


const scannerGuide =
  document.getElementById(
    'scannerGuide'
  );


const retakeButton =
  document.getElementById(
    'retakeButton'
  );


const useButton =
  document.getElementById(
    'useButton'
  );


const instruction =
  document.getElementById(
    'instruction'
  );


const status =
  document.getElementById(
    'status'
  );


const errorBox =
  document.getElementById(
    'error'
  );


const resultLabel =
  document.getElementById(
    'resultLabel'
  );


/*
 * ==========================================================
 * ERROR
 * ==========================================================
 */

function showError(
  message
){

  errorBox.textContent =
    message;

  errorBox.style.display =
    'block';

}


function clearError(){

  errorBox.textContent =
    '';

  errorBox.style.display =
    'none';

}


/*
 * ==========================================================
 * DYNAMIC OPENCV LOADER
 *
 * IMPORTANT:
 * Camera starts BEFORE this loads.
 * ==========================================================
 */

function loadOpenCV(){

  return new Promise(
    function(
      resolve,
      reject
    ){

      if(
        window.cv &&
        window.cv.Mat &&
        window.cv.matFromImageData
      ){

        cvReady =
          true;

        resolve();

        return;

      }


      const script =
        document.createElement(
          'script'
        );


      script.src =
        'https://docs.opencv.org/4.x/opencv.js';


      script.async =
        true;


      let finished =
        false;


      const timeout =
        setTimeout(
          function(){

            if(
              finished
            ){

              return;

            }


            finished =
              true;


            reject(
              new Error(
                'OpenCV loading timed out.'
              )
            );

          },
          20000
        );


      script.onload =
        function(){

          const start =
            Date.now();


          const check =
            setInterval(
              function(){

                if(
                  window.cv &&
                  window.cv.Mat &&
                  window.cv.matFromImageData
                ){

                  clearInterval(
                    check
                  );

                  clearTimeout(
                    timeout
                  );


                  if(
                    !finished
                  ){

                    finished =
                      true;

                    cvReady =
                      true;

                    resolve();

                  }

                }


                if(
                  Date.now() -
                  start >
                  18000
                ){

                  clearInterval(
                    check
                  );

                  clearTimeout(
                    timeout
                  );


                  if(
                    !finished
                  ){

                    finished =
                      true;

                    reject(
                      new Error(
                        'OpenCV failed to initialize.'
                      )
                    );

                  }

                }

              },
              100
            );

        };


      script.onerror =
        function(){

          if(
            finished
          ){

            return;

          }


          finished =
            true;


          clearTimeout(
            timeout
          );


          reject(
            new Error(
              'Unable to load OpenCV.'
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


/*
 * ==========================================================
 * DISTANCE
 * ==========================================================
 */

function distance(
  a,
  b
){

  return Math.hypot(

    b.x - a.x,

    b.y - a.y

  );

}


/*
 * ==========================================================
 * ORDER CORNERS
 * ==========================================================
 */

function orderCorners(
  points
){

  if(
    points.length !== 4
  ){

    return null;

  }


  const sums =
    points.map(
      p =>
        p.x + p.y
    );


  const differences =
    points.map(
      p =>
        p.x - p.y
    );


  const tl =
    sums.indexOf(
      Math.min(
        ...sums
      )
    );


  const br =
    sums.indexOf(
      Math.max(
        ...sums
      )
    );


  const tr =
    differences.indexOf(
      Math.max(
        ...differences
      )
    );


  const bl =
    differences.indexOf(
      Math.min(
        ...differences
      )
    );


  const result = [

    points[tl],
    points[tr],
    points[br],
    points[bl]

  ];


  /*
   * Make sure no point was duplicated.
   */

  const unique =
    new Set(
      result.map(
        p =>
          p.x +
          ':' +
          p.y
      )
    );


  if(
    unique.size !== 4
  ){

    return null;

  }


  return result;

}


/*
 * ==========================================================
 * DOCUMENT DETECTION
 *
 * We look for the largest vertical
 * rectangular document in the frame.
 *
 * No OCR.
 * No face detection.
 * No other requirements.
 * ==========================================================
 */

function detectDocument(){

  const cv =
    window.cv;


  if(
    !cv ||
    !video.videoWidth ||
    !video.videoHeight
  ){

    return null;

  }


  /*
   * Work on a small image for speed.
   */

  const scanWidth =
    360;


  const scale =
    scanWidth /
    video.videoWidth;


  const scanHeight =
    Math.round(
      video.videoHeight *
      scale
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    scanWidth;


  canvas.height =
    scanHeight;


  const context =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  context.drawImage(

    video,

    0,
    0,

    scanWidth,
    scanHeight

  );


  const frame =
    context.getImageData(

      0,
      0,

      scanWidth,
      scanHeight

    );


  const source =
    cv.matFromImageData(
      frame
    );


  const gray =
    new cv.Mat();


  const blur =
    new cv.Mat();


  const edges =
    new cv.Mat();


  const contours =
    new cv.MatVector();


  const hierarchy =
    new cv.Mat();


  let candidates = [];


  try{

    /*
     * Grayscale.
     */

    cv.cvtColor(

      source,

      gray,

      cv.COLOR_RGBA2GRAY

    );


    /*
     * Reduce noise.
     */

    cv.GaussianBlur(

      gray,

      blur,

      new cv.Size(
        5,
        5
      ),

      0

    );


    /*
     * Detect boundaries.
     */

    cv.Canny(

      blur,

      edges,

      50,

      150

    );


    /*
     * Close tiny gaps in the
     * document border.
     */

    const kernel =
      cv.Mat.ones(
        3,
        3,
        cv.CV_8U
      );


    cv.dilate(
      edges,
      edges,
      kernel
    );


    cv.erode(
      edges,
      edges,
      kernel
    );


    kernel.delete();


    /*
     * Find contours.
     */

    cv.findContours(

      edges,

      contours,

      hierarchy,

      cv.RETR_EXTERNAL,

      cv.CHAIN_APPROX_SIMPLE

    );


    const frameArea =
      scanWidth *
      scanHeight;


    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);


      try{

        const area =
          Math.abs(
            cv.contourArea(
              contour
            )
          );


        /*
         * Ignore small objects.
         */

        if(
          area <
          frameArea * 0.08
        ){

          continue;

        }


        const perimeter =
          cv.arcLength(
            contour,
            true
          );


        if(
          perimeter <= 0
        ){

          continue;

        }


        const approximation =
          new cv.Mat();


        try{

          cv.approxPolyDP(

            contour,

            approximation,

            perimeter *
            0.025,

            true

          );


          /*
           * We primarily want a four
           * corner boundary.
           */

          if(
            approximation.rows !== 4
          ){

            /*
             * Don't immediately reject it.
             *
             * Rounded/covered cards can
             * still be recovered from the
             * minimum-area rectangle.
             */

            const rotated =
              cv.minAreaRect(
                contour
              );


            const points =
              cv.boxPoints(
                rotated
              );


            const usable =
              evaluateRectangle(
                points,
                area,
                scanWidth,
                scanHeight,
                scale
              );


            if(
              usable
            ){

              candidates.push(
                usable
              );

            }


            continue;

          }


          const points = [];


          for(
            let p = 0;
            p < 4;
            p++
          ){

            points.push({

              x:
                approximation.intAt(
                  p,
                  0
                ) / scale,

              y:
                approximation.intAt(
                  p,
                  1
                ) / scale

            });

          }


          const ordered =
            orderCorners(
              points
            );


          if(
            !ordered
          ){

            continue;

          }


          const candidate =
            evaluateOrderedRectangle(

              ordered,

              area,

              scanWidth,

              scanHeight

            );


          if(
            candidate
          ){

            candidates.push(
              candidate
            );

          }

        }
        finally{

          approximation.delete();

        }

      }
      finally{

        contour.delete();

      }

    }

  }
  finally{

    source.delete();

    gray.delete();

    blur.delete();

    edges.delete();

    contours.delete();

    hierarchy.delete();

  }


  /*
   * Sort largest/strongest first.
   */

  candidates.sort(
    function(
      a,
      b
    ){

      return (
        b.score -
        a.score
      );

    }
  );


  return (
    candidates[0] ||
    null
  );

}


/*
 * ==========================================================
 * EVALUATE 4-CORNER RECTANGLE
 * ==========================================================
 */

function evaluateOrderedRectangle(

  points,

  area,

  scanWidth,

  scanHeight

){

  const topWidth =
    distance(
      points[0],
      points[1]
    );


  const bottomWidth =
    distance(
      points[3],
      points[2]
    );


  const leftHeight =
    distance(
      points[0],
      points[3]
    );


  const rightHeight =
    distance(
      points[1],
      points[2]
    );


  const width =
    (
      topWidth +
      bottomWidth
    ) / 2;


  const height =
    (
      leftHeight +
      rightHeight
    ) / 2;


  if(
    width <= 0 ||
    height <= 0
  ){

    return null;

  }


  const ratio =
    width /
    height;


  /*
   * Your physical ID is portrait.
   * Allow a fairly wide range because
   * perspective changes the ratio.
   */

  if(
    ratio < 0.35 ||
    ratio > 0.95
  ){

    return null;

  }


  const areaRatio =
    area /
    (
      scanWidth *
      scanHeight
    );


  if(
    areaRatio <
    0.08
  ){

    return null;

  }


  const centerX =
    (
      points[0].x +
      points[1].x +
      points[2].x +
      points[3].x
    ) / 4;


  const centerY =
    (
      points[0].y +
      points[1].y +
      points[2].y +
      points[3].y
    ) / 4;


  const normalizedX =
    centerX /
    (
      scanWidth /
      (
        video.videoWidth /
        video.videoWidth
      )
    );


  /*
   * Instead of using the above
   * calculation for screen position,
   * calculate from actual camera.
   */

  const actualCenterX =
    (
      points[0].x +
      points[1].x +
      points[2].x +
      points[3].x
    ) / 4;


  const actualCenterY =
    (
      points[0].y +
      points[1].y +
      points[2].y +
      points[3].y
    ) / 4;


  const xNormalized =
    actualCenterX /
    video.videoWidth;


  const yNormalized =
    actualCenterY /
    video.videoHeight;


  /*
   * Card should be reasonably centered,
   * but not excessively strict.
   */

  const centerDistance =

    Math.hypot(

      xNormalized -
      0.5,

      yNormalized -
      0.5

    );


  /*
   * Aspect ratio target:
   *
   * 54 / 85.6 ≈ 0.631
   */

  const targetRatio =
    54 / 85.6;


  const ratioError =
    Math.abs(
      ratio -
      targetRatio
    );


  /*
   * Scoring.
   *
   * Larger document + centered +
   * portrait ratio = better.
   */

  const score =

    areaRatio * 100

    +

    Math.max(
      0,
      25 -
      ratioError * 50
    )

    +

    Math.max(
      0,
      20 -
      centerDistance * 40
    );


  /*
   * Convert coordinates back to
   * actual camera resolution.
   */

  const scaleX =
    video.videoWidth /
    scanWidth;


  const scaleY =
    video.videoHeight /
    scanHeight;


  return {

    points:
      points.map(
        function(
          p
        ){

          return {

            x:
              p.x *
              scaleX,

            y:
              p.y *
              scaleY

          };

        }
      ),


    areaRatio:
      areaRatio,


    ratio:
      ratio,


    score:
      score

  };

}


/*
 * ==========================================================
 * EVALUATE MIN AREA RECTANGLE
 * ==========================================================
 */

function evaluateRectangle(

  boxPoints,

  area,

  scanWidth,

  scanHeight,

  scale

){

  const points = [];


  for(
    let i = 0;
    i < 4;
    i++
  ){

    points.push({

      x:
        boxPoints[i].x,

      y:
        boxPoints[i].y

    });

  }


  const ordered =
    orderCorners(
      points
    );


  if(
    !ordered
  ){

    return null;

  }


  return evaluateOrderedRectangle(

    ordered,

    area,

    scanWidth,

    scanHeight

  );

}


/*
 * ==========================================================
 * STABILITY
 * ==========================================================
 */

function getCenter(
  card
){

  return {

    x:
      (
        card.points[0].x +
        card.points[1].x +
        card.points[2].x +
        card.points[3].x
      ) / 4,

    y:
      (
        card.points[0].y +
        card.points[1].y +
        card.points[2].y +
        card.points[3].y
      ) / 4

  };

}


function isStable(
  current
){

  if(
    !current
  ){

    lastDetection =
      null;

    stableFrames =
      0;

    return false;

  }


  if(
    !lastDetection
  ){

    lastDetection =
      current;

    stableFrames =
      0;

    return false;

  }


  const a =
    getCenter(
      current
    );


  const b =
    getCenter(
      lastDetection
    );


  const movement =
    Math.hypot(

      a.x - b.x,

      a.y - b.y

    );


  const sizeDifference =

    Math.abs(

      current.areaRatio -
      lastDetection.areaRatio

    );


  if(
    movement < 16 &&
    sizeDifference < 0.035
  ){

    stableFrames++;

  }
  else{

    stableFrames =
      0;

  }


  lastDetection =
    current;


  return (
    stableFrames >= 3
  );

}


/*
 * ==========================================================
 * UPDATE STATUS
 * ==========================================================
 */

function updateStatus(
  card,
  stable
){

  if(
    !card
  ){

    scannerGuide
      .classList
      .remove(
        'detected'
      );


    instruction.textContent =
      'Position your Student ID inside the guide.';


    status.textContent =
      'Searching for the card boundaries...';


    return;

  }


  scannerGuide
    .classList
    .add(
      'detected'
    );


  if(
    !stable
  ){

    instruction.textContent =
      'ID detected. Hold still...';


    status.textContent =
      'Preparing automatic capture...';


    return;

  }


  instruction.textContent =
    'ID detected. Capturing...';


  status.textContent =
    'Please hold still.';

}


/*
 * ==========================================================
 * PERSPECTIVE CORRECTION
 * ==========================================================
 */

function perspectiveCorrect(
  card
){

  const cv =
    window.cv;


  if(
    !cv
  ){

    throw new Error(
      'OpenCV is not ready.'
    );

  }


  const tl =
    card.points[0];

  const tr =
    card.points[1];

  const br =
    card.points[2];

  const bl =
    card.points[3];


  const widthTop =
    distance(
      tl,
      tr
    );


  const widthBottom =
    distance(
      bl,
      br
    );


  const heightLeft =
    distance(
      tl,
      bl
    );


  const heightRight =
    distance(
      tr,
      br
    );


  const outputWidth =
    Math.round(
      Math.max(
        widthTop,
        widthBottom
      )
    );


  const outputHeight =
    Math.round(
      Math.max(
        heightLeft,
        heightRight
      )
    );


  const sourceCanvas =
    document.createElement(
      'canvas'
    );


  sourceCanvas.width =
    video.videoWidth;


  sourceCanvas.height =
    video.videoHeight;


  const ctx =
    sourceCanvas.getContext(
      '2d'
    );


  ctx.drawImage(

    video,

    0,
    0,

    sourceCanvas.width,
    sourceCanvas.height

  );


  const imageData =
    ctx.getImageData(

      0,
      0,

      sourceCanvas.width,
      sourceCanvas.height

    );


  const source =
    cv.matFromImageData(
      imageData
    );


  const destination =
    new cv.Mat();


  const sourcePoints =
    cv.matFromArray(

      4,
      1,

      cv.CV_32FC2,

      [

        tl.x,
        tl.y,

        tr.x,
        tr.y,

        br.x,
        br.y,

        bl.x,
        bl.y

      ]

    );


  const destinationPoints =
    cv.matFromArray(

      4,
      1,

      cv.CV_32FC2,

      [

        0,
        0,

        outputWidth,
        0,

        outputWidth,
        outputHeight,

        0,
        outputHeight

      ]

    );


  const transform =
    cv.getPerspectiveTransform(

      sourcePoints,

      destinationPoints

    );


  cv.warpPerspective(

    source,

    destination,

    transform,

    new cv.Size(
      outputWidth,
      outputHeight
    )

  );


  const outputCanvas =
    document.createElement(
      'canvas'
    );


  outputCanvas.width =
    outputWidth;


  outputCanvas.height =
    outputHeight;


  cv.imshow(
    outputCanvas,
    destination
  );


  const result =
    outputCanvas.toDataURL(
      'image/jpeg',
      0.94
    );


  source.delete();

  destination.delete();

  sourcePoints.delete();

  destinationPoints.delete();

  transform.delete();


  return result;

}


/*
 * ==========================================================
 * AUTO CAPTURE
 * ==========================================================
 */

function autoCapture(
  card
){

  if(
    autoCaptured
  ){

    return;

  }


  autoCaptured =
    true;


  try{

    instruction.textContent =
      'Scanning Student ID...';


    const corrected =
      perspectiveCorrect(
        card
      );


    capturedData =
      corrected;


    capturedImage.src =
      corrected;


    capturedImage.style.display =
      'block';


    video.style.display =
      'none';


    scannerGuide.style.display =
      'none';


    retakeButton.style.display =
      'inline-block';


    useButton.style.display =
      'inline-block';


    resultLabel.style.display =
      'block';


    instruction.textContent =
      '✓ Student ID captured';


    status.textContent =
      'Review the corrected scan before continuing.';


    stopCamera();

  }
  catch(error){

    console.error(
      error
    );


    autoCaptured =
      false;


    showError(
      'The ID could not be corrected. Please try again.';

    );

  }

}


/*
 * ==========================================================
 * SCAN LOOP
 * ==========================================================
 */

function scheduleScan(){

  if(
    autoCaptured
  ){

    return;

  }


  scanTimer =
    setTimeout(
      scanFrame,
      250
    );

}


function scanFrame(){

  if(
    scanning ||
    autoCaptured
  ){

    return;

  }


  if(
    !cvReady
  ){

    status.textContent =
      'Loading scanner...';


    scheduleScan();

    return;

  }


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    scheduleScan();

    return;

  }


  scanning =
    true;


  try{

    const card =
      detectDocument();


    const stable =
      isStable(
        card
      );


    updateStatus(
      card,
      stable
    );


    if(
      card &&
      stable
    ){

      autoCapture(
        card
      );


      return;

    }

  }
  catch(error){

    console.error(
      'Scanner error:',
      error
    );

  }
  finally{

    scanning =
      false;

  }


  scheduleScan();

}


/*
 * ==========================================================
 * CAMERA
 * ==========================================================
 */

async function startCamera(){

  clearError();


  stopCamera();


  instruction.textContent =
    'Requesting camera...';


  let localStream;


  try{

    /*
     * Prefer rear camera on phones.
     */

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:
                'environment'
            },

            width:{
              ideal:
                1280
            },

            height:{
              ideal:
                720
            }

          },

          audio:false

        });

  }
  catch(error){

    /*
     * Fallback for laptops.
     */

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            width:{
              ideal:
                640
            },

            height:{
              ideal:
                480
            }

          },

          audio:false

        });

  }


  stream =
    localStream;


  video.srcObject =
    stream;


  await video.play();


  instruction.textContent =
    'Camera ready. Position your Student ID in the center.';


  scheduleScan();

}


/*
 * ==========================================================
 * RETAKE
 * ==========================================================
 */

async function retakeScan(){

  clearError();


  capturedData =
    null;


  autoCaptured =
    false;


  lastDetection =
    null;


  stableFrames =
    0;


  capturedImage.style.display =
    'none';


  resultLabel.style.display =
    'none';


  retakeButton.style.display =
    'none';


  useButton.style.display =
    'none';


  scannerGuide.style.display =
    'block';


  scannerGuide
    .classList
    .remove(
      'detected'
    );


  video.style.display =
    'block';


  instruction.textContent =
    'Starting camera...';


  status.textContent =
    'Position your ID inside the guide.';


  await startCamera();

}


/*
 * ==========================================================
 * USE SCAN
 * ==========================================================
 */

function useScan(){

  if(
    !capturedData
  ){

    showError(
      'No Student ID scan is available.'
    );

    return;

  }


  if(
    window.opener
  ){

    window.opener.postMessage(

      {

        type:
          'STUDENT_ID_CAPTURED',

        image:
          capturedData

      },

      '*'

    );

  }


  instruction.textContent =
    'Student ID accepted. Returning to the application...';


  status.textContent =
    '';


  setTimeout(
    function(){

      window.close();

    },
    600
  );

}


/*
 * ==========================================================
 * STOP CAMERA
 * ==========================================================
 */

function stopCamera(){

  if(
    scanTimer
  ){

    clearTimeout(
      scanTimer
    );

    scanTimer =
      null;

  }


  if(
    stream
  ){

    stream
      .getTracks()
      .forEach(
        function(
          track
        ){

          track.stop();

        }
      );


    stream =
      null;

  }


  if(
    video
  ){

    video.srcObject =
      null;

  }

}


/*
 * ==========================================================
 * PARENT COMMUNICATION
 * ==========================================================
 */

window.addEventListener(
  'load',
  function(){

    if(
      window.opener
    ){

      window.opener.postMessage(

        {
          type:
            'ID_CAMERA_READY'
        },

        '*'

      );

    }

  }
);


/*
 * ==========================================================
 * RECEIVE STUDENT DATA
 *
 * We don't use it for verification
 * anymore. It is simply retained for
 * future integration.
 * ==========================================================
 */

window.addEventListener(
  'message',
  function(event){

    if(
      !event.data
    ){

      return;

    }


    if(
      event.data.type ===
      'ID_CAMERA_INIT'
    ){

      /*
       * No verification is performed.
       */

      status.textContent =
        'Scanner ready.';

    }

  }
);


/*
 * ==========================================================
 * CLEANUP
 * ==========================================================
 */

window.addEventListener(
  'beforeunload',
  stopCamera
);


/*
 * Expose functions for buttons.
 */

window.retakeScan =
  retakeScan;

window.useScan =
  useScan;


/*
 * ==========================================================
 * START
 * ==========================================================
 */

async function initialize(){

  /*
   * CAMERA FIRST.
   */

  try{

    await startCamera();

  }
  catch(error){

    console.error(
      error
    );


    showError(
      'Unable to access the camera. Please allow camera access and refresh the page.'
    );


    return;

  }


  /*
   * Load OpenCV AFTER camera is visible.
   */

  try{

    status.textContent =
      'Loading automatic document scanner...';


    await loadOpenCV();


    status.textContent =
      'Document scanner ready.';

  }
  catch(error){

    console.error(
      'OpenCV error:',
      error
    );


    status.textContent =
      'Document scanner could not load.';

  }

}


initialize();

</script>
