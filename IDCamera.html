<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Student ID Scanner</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      padding:18px;
      background:#f4f7fb;
      font-family:Arial,sans-serif;
      color:#172033;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
      width:100%;
      max-width:620px;
      background:#fff;
      border-radius:20px;
      padding:20px;
      box-shadow:0 10px 35px rgba(0,0,0,.12);
      text-align:center;
    }

    h1{
      margin:0 0 8px;
    }

    .muted{
      color:#667085;
      font-size:14px;
      line-height:1.4;
    }

    .camera-wrap{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio:3 / 4;
      margin:20px auto;
      overflow:hidden;
      border-radius:18px;
      background:#111827;
    }

    #video,
    #capturedImage{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    #video{
      display:block;
    }

    #capturedImage{
      display:none;
      object-fit:contain;
      background:#111827;
    }

    #guide{
      position:absolute;
      left:50%;
      top:50%;
      width:70%;
      aspect-ratio:3 / 4;
      transform:translate(-50%,-50%);
      border:3px solid rgba(255,255,255,.95);
      border-radius:14px;
      pointer-events:none;
      box-shadow:0 0 0 9999px rgba(0,0,0,.30);
    }

    #guide.detected{
      border-color:#22c55e;
    }

    .corner{
      position:absolute;
      width:26px;
      height:26px;
      border:4px solid white;
    }

    .tl{
      top:-3px;
      left:-3px;
      border-right:0;
      border-bottom:0;
      border-radius:8px 0 0 0;
    }

    .tr{
      top:-3px;
      right:-3px;
      border-left:0;
      border-bottom:0;
      border-radius:0 8px 0 0;
    }

    .bl{
      bottom:-3px;
      left:-3px;
      border-right:0;
      border-top:0;
      border-radius:0 0 0 8px;
    }

    .br{
      bottom:-3px;
      right:-3px;
      border-left:0;
      border-top:0;
      border-radius:0 0 8px 0;
    }

    #instruction{
      margin-top:10px;
      font-weight:800;
      font-size:15px;
    }

    #status{
      margin-top:7px;
      min-height:20px;
      font-size:13px;
      color:#667085;
    }

    .error{
      display:none;
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      background:#fee2e2;
      color:#991b1b;
      font-size:14px;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:16px;
      flex-wrap:wrap;
    }

    button{
      border:0;
      border-radius:10px;
      padding:12px 18px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .secondary{
      background:#e5e7eb;
      color:#172033;
    }

    .success{
      background:#15803d;
      color:#fff;
    }

  </style>

</head>

<body>

<div class="card">

  <h1>Student ID Scanner</h1>

  <p class="muted">
    Hold your physical Student ID vertically in the center.
    The system will automatically detect and scan the card.
  </p>

  <div class="camera-wrap">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <img
      id="capturedImage"
      alt="Scanned Student ID"
    >

    <div id="guide">

      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

    </div>

  </div>

  <div id="instruction">
    Starting camera...
  </div>

  <div id="status">
    Please allow camera access.
  </div>

  <div class="actions">

    <button
      id="retakeButton"
      class="secondary"
      style="display:none"
      onclick="retakeScan()"
    >
      Retake
    </button>

    <button
      id="useButton"
      class="success"
      style="display:none"
      onclick="useScan()"
    >
      Use This ID
    </button>

  </div>

  <div
    id="error"
    class="error"
  ></div>

</div>


<script>

let stream = null;

let opencvReady = false;

let scanTimer = null;

let scanning = false;

let stableFrames = 0;

let lastCard = null;

let capturedData = null;

let autoCaptured = false;


const video =
  document.getElementById('video');

const guide =
  document.getElementById('guide');

const capturedImage =
  document.getElementById('capturedImage');

const instruction =
  document.getElementById('instruction');

const status =
  document.getElementById('status');

const errorBox =
  document.getElementById('error');

const retakeButton =
  document.getElementById('retakeButton');

const useButton =
  document.getElementById('useButton');


function showError(text){

  errorBox.textContent =
    text;

  errorBox.style.display =
    'block';

}


function clearError(){

  errorBox.textContent =
    '';

  errorBox.style.display =
    'none';

}


/* ==========================================================
   START CAMERA
   ========================================================== */

async function startCamera(){

  clearError();

  instruction.textContent =
    'Requesting camera access...';

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'Camera API is not available.'
      );

    }


    /*
     * First try the rear camera.
     * This is best for a phone scanning
     * a physical ID.
     */

    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              ideal:'environment'
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }
          },

          audio:false

        });

    }
    catch(firstError){

      /*
       * Laptop fallback.
       */

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            width:{
              ideal:640
            },

            height:{
              ideal:480
            }
          },

          audio:false

        });

    }


    video.srcObject =
      stream;

    await video.play();


    instruction.textContent =
      'Camera ready. Position your Student ID in the center.';

    status.textContent =
      'Loading document scanner...';


    loadOpenCV();


  }
  catch(error){

    console.error(
      'CAMERA ERROR:',
      error
    );

    instruction.textContent =
      'Camera could not start.';

    showError(
      'Camera access failed. Please allow camera permission for this site and refresh the page.'
    );

  }

}


/* ==========================================================
   LOAD OPENCV AFTER CAMERA
   ========================================================== */

function loadOpenCV(){

  if(
    window.cv &&
    window.cv.Mat
  ){

    opencvReady =
      true;

    status.textContent =
      'Document scanner ready.';

    beginScanning();

    return;

  }


  const script =
    document.createElement('script');


  script.src =
    'https://docs.opencv.org/4.x/opencv.js';

  script.async =
    true;


  script.onload =
    function(){

      waitForOpenCV();

    };


  script.onerror =
    function(){

      status.textContent =
        'Document scanner failed to load.';

      showError(
        'The document scanner library could not be loaded.'
      );

    };


  document.head.appendChild(
    script
  );

}


function waitForOpenCV(){

  const started =
    Date.now();


  const timer =
    setInterval(
      function(){

        if(
          window.cv &&
          window.cv.Mat &&
          window.cv.matFromImageData
        ){

          clearInterval(
            timer
          );

          opencvReady =
            true;

          status.textContent =
            'Document scanner ready.';

          beginScanning();

          return;

        }


        if(
          Date.now() -
          started >
          20000
        ){

          clearInterval(
            timer
          );

          showError(
            'The document scanner took too long to load.'
          );

        }

      },
      100
    );

}


/* ==========================================================
   HELPERS
   ========================================================== */

function distance(a,b){

  return Math.hypot(
    b.x-a.x,
    b.y-a.y
  );

}


function orderCorners(points){

  if(
    !points ||
    points.length !== 4
  ){

    return null;

  }


  const sums =
    points.map(
      p =>
        p.x+p.y
    );


  const diffs =
    points.map(
      p =>
        p.x-p.y
    );


  const tl =
    sums.indexOf(
      Math.min(...sums)
    );


  const br =
    sums.indexOf(
      Math.max(...sums)
    );


  const tr =
    diffs.indexOf(
      Math.max(...diffs)
    );


  const bl =
    diffs.indexOf(
      Math.min(...diffs)
    );


  return [

    points[tl],
    points[tr],
    points[br],
    points[bl]

  ];

}


/* ==========================================================
   DOCUMENT DETECTION
   ========================================================== */

function detectDocument(){

  if(
    !opencvReady ||
    !window.cv ||
    !video.videoWidth
  ){

    return null;

  }


  const cv =
    window.cv;


  const scanWidth =
    320;


  const scale =
    scanWidth /
    video.videoWidth;


  const scanHeight =
    Math.round(
      video.videoHeight *
      scale
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    scanWidth;

  canvas.height =
    scanHeight;


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently:true
      }
    );


  ctx.drawImage(
    video,
    0,
    0,
    scanWidth,
    scanHeight
  );


  const data =
    ctx.getImageData(
      0,
      0,
      scanWidth,
      scanHeight
    );


  const src =
    cv.matFromImageData(
      data
    );


  const gray =
    new cv.Mat();

  const blur =
    new cv.Mat();

  const edges =
    new cv.Mat();

  const contours =
    new cv.MatVector();

  const hierarchy =
    new cv.Mat();


  let best =
    null;


  try{

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.GaussianBlur(
      gray,
      blur,
      new cv.Size(5,5),
      0
    );


    cv.Canny(
      blur,
      edges,
      50,
      150
    );


    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );


    const frameArea =
      scanWidth *
      scanHeight;


    for(
      let i=0;
      i<contours.size();
      i++
    ){

      const contour =
        contours.get(i);


      try{

        const area =
          Math.abs(
            cv.contourArea(
              contour
            )
          );


        if(
          area <
          frameArea * 0.08
        ){

          continue;

        }


        const perimeter =
          cv.arcLength(
            contour,
            true
          );


        const approx =
          new cv.Mat();


        try{

          cv.approxPolyDP(
            contour,
            approx,
            perimeter*0.03,
            true
          );


          let points = null;


          if(
            approx.rows === 4
          ){

            points = [];


            for(
              let j=0;
              j<4;
              j++
            ){

              points.push({

                x:
                  approx.intAt(
                    j,
                    0
                  ),

                y:
                  approx.intAt(
                    j,
                    1
                  )

              });

            }

          }
          else{

            /*
             * Fallback:
             * use minimum-area rectangle.
             */

            const rect =
              cv.minAreaRect(
                contour
              );


            const box =
              cv.RotatedRect.points(
                rect
              );


            points =
              box.map(
                p => ({
                  x:p.x,
                  y:p.y
                })
              );

          }


          const ordered =
            orderCorners(
              points
            );


          if(
            !ordered
          ){

            continue;

          }


          const width =
            (
              distance(
                ordered[0],
                ordered[1]
              )
              +
              distance(
                ordered[3],
                ordered[2]
              )
            ) / 2;


          const height =
            (
              distance(
                ordered[0],
                ordered[3]
              )
              +
              distance(
                ordered[1],
                ordered[2]
              )
            ) / 2;


          if(
            width<=0 ||
            height<=0
          ){

            continue;

          }


          const ratio =
            width/height;


          /*
           * Portrait ID.
           */

          if(
            ratio<0.35 ||
            ratio>0.95
          ){

            continue;

          }


          const centerX =
            (
              ordered[0].x+
              ordered[1].x+
              ordered[2].x+
              ordered[3].x
            )/4;


          const centerY =
            (
              ordered[0].y+
              ordered[1].y+
              ordered[2].y+
              ordered[3].y
            )/4;


          const normalizedX =
            centerX/scanWidth;


          const normalizedY =
            centerY/scanHeight;


          /*
           * Reasonably centered.
           */

          if(
            normalizedX<0.20 ||
            normalizedX>0.80 ||
            normalizedY<0.12 ||
            normalizedY>0.88
          ){

            continue;

          }


          const areaRatio =
            area/frameArea;


          if(
            areaRatio<0.08
          ){

            continue;

          }


          /*
           * Score candidate.
           */

          const ratioError =
            Math.abs(
              ratio-(54/85.6)
            );


          const centerError =
            Math.hypot(
              normalizedX-0.5,
              normalizedY-0.5
            );


          const score =

            areaRatio*100

            -

            ratioError*20

            -

            centerError*20;


          if(
            !best ||
            score>best.score
          ){

            const sx =
              video.videoWidth/
              scanWidth;

            const sy =
              video.videoHeight/
              scanHeight;


            best = {

              score:score,

              areaRatio:areaRatio,

              points:
                ordered.map(
                  p => ({

                    x:p.x*sx,

                    y:p.y*sy

                  })
                )

            };

          }

        }
        finally{

          approx.delete();

        }

      }
      finally{

        contour.delete();

      }

    }

  }
  finally{

    src.delete();
    gray.delete();
    blur.delete();
    edges.delete();
    contours.delete();
    hierarchy.delete();

  }


  return best;

}


/* ==========================================================
   STABILITY
   ========================================================== */

function checkStable(
  current
){

  if(
    !current
  ){

    lastCard =
      null;

    stableFrames =
      0;

    return false;

  }


  if(
    !lastCard
  ){

    lastCard =
      current;

    stableFrames =
      0;

    return false;

  }


  function center(
    card
  ){

    return {

      x:
        (
          card.points[0].x+
          card.points[1].x+
          card.points[2].x+
          card.points[3].x
        )/4,

      y:
        (
          card.points[0].y+
          card.points[1].y+
          card.points[2].y+
          card.points[3].y
        )/4

    };

  }


  const a =
    center(current);

  const b =
    center(lastCard);


  const movement =
    Math.hypot(
      a.x-b.x,
      a.y-b.y
    );


  if(
    movement<18
  ){

    stableFrames++;

  }
  else{

    stableFrames =
      0;

  }


  lastCard =
    current;


  return (
    stableFrames>=3
  );

}


/* ==========================================================
   PERSPECTIVE CORRECTION
   ========================================================== */

function correctDocument(
  card
){

  const cv =
    window.cv;


  const tl =
    card.points[0];

  const tr =
    card.points[1];

  const br =
    card.points[2];

  const bl =
    card.points[3];


  const outputWidth =
    Math.round(
      Math.max(
        distance(tl,tr),
        distance(bl,br)
      )
    );


  const outputHeight =
    Math.round(
      Math.max(
        distance(tl,bl),
        distance(tr,br)
      )
    );


  const sourceCanvas =
    document.createElement(
      'canvas'
    );


  sourceCanvas.width =
    video.videoWidth;

  sourceCanvas.height =
    video.videoHeight;


  const sourceContext =
    sourceCanvas.getContext(
      '2d'
    );


  sourceContext.drawImage(
    video,
    0,
    0,
    sourceCanvas.width,
    sourceCanvas.height
  );


  const frame =
    sourceContext.getImageData(
      0,
      0,
      sourceCanvas.width,
      sourceCanvas.height
    );


  const src =
    cv.matFromImageData(
      frame
    );


  const dst =
    new cv.Mat();


  const srcPoints =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [

        tl.x,
        tl.y,

        tr.x,
        tr.y,

        br.x,
        br.y,

        bl.x,
        bl.y

      ]
    );


  const dstPoints =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [

        0,
        0,

        outputWidth,
        0,

        outputWidth,
        outputHeight,

        0,
        outputHeight

      ]
    );


  const transform =
    cv.getPerspectiveTransform(
      srcPoints,
      dstPoints
    );


  cv.warpPerspective(
    src,
    dst,
    transform,
    new cv.Size(
      outputWidth,
      outputHeight
    )
  );


  const outputCanvas =
    document.createElement(
      'canvas'
    );


  outputCanvas.width =
    outputWidth;

  outputCanvas.height =
    outputHeight;


  cv.imshow(
    outputCanvas,
    dst
  );


  const result =
    outputCanvas.toDataURL(
      'image/jpeg',
      0.95
    );


  src.delete();
  dst.delete();
  srcPoints.delete();
  dstPoints.delete();
  transform.delete();


  return result;

}


/* ==========================================================
   AUTO CAPTURE
   ========================================================== */

function autoCapture(
  card
){

  if(
    autoCaptured
  ){

    return;

  }


  autoCaptured =
    true;


  try{

    instruction.textContent =
      'Scanning ID...';


    const image =
      correctDocument(
        card
      );


    capturedData =
      image;


    capturedImage.src =
      image;


    capturedImage.style.display =
      'block';


    video.style.display =
      'none';


    guide.style.display =
      'none';


    retakeButton.style.display =
      'inline-block';


    useButton.style.display =
      'inline-block';


    instruction.textContent =
      '✓ ID captured successfully';


    status.textContent =
      'Review the scanned ID before continuing.';


    stopCamera();

  }
  catch(error){

    console.error(
      error
    );


    autoCaptured =
      false;


    showError(
      'Unable to crop the ID. Please try again.'
    );

  }

}


/* ==========================================================
   SCAN LOOP
   ========================================================== */

function beginScanning(){

  if(
    scanTimer
  ){

    clearTimeout(
      scanTimer
    );

  }


  scanFrame();

}


function scanFrame(){

  if(
    scanning ||
    autoCaptured
  ){

    return;

  }


  if(
    !opencvReady
  ){

    status.textContent =
      'Loading document scanner...';


    scheduleNext();

    return;

  }


  scanning =
    true;


  try{

    const card =
      detectDocument();


    const stable =
      checkStable(
        card
      );


    if(
      card
    ){

      guide.classList.add(
        'detected'
      );


      if(
        stable
      ){

        instruction.textContent =
          'ID detected. Hold still...';


        autoCapture(
          card
        );


        return;

      }


      instruction.textContent =
        'ID detected. Hold still...';


      status.textContent =
        'Preparing automatic capture...';

    }
    else{

      guide.classList.remove(
        'detected'
      );


      instruction.textContent =
        'Position your Student ID in the center.';


      status.textContent =
        'Searching for the ID boundaries...';

    }

  }
  catch(error){

    console.error(
      'Scan error:',
      error
    );

  }
  finally{

    scanning =
      false;

  }


  scheduleNext();

}


function scheduleNext(){

  if(
    autoCaptured
  ){

    return;

  }


  scanTimer =
    setTimeout(
      scanFrame,
      300
    );

}


/* ==========================================================
   RETAKE
   ========================================================== */

async function retakeScan(){

  capturedData =
    null;

  autoCaptured =
    false;

  lastCard =
    null;

  stableFrames =
    0;


  capturedImage.style.display =
    'none';


  video.style.display =
    'block';


  guide.style.display =
    'block';


  guide.classList.remove(
    'detected'
  );


  retakeButton.style.display =
    'none';


  useButton.style.display =
    'none';


  instruction.textContent =
    'Starting camera...';


  status.textContent =
    'Position your Student ID in the center.';


  await startCamera();

}


/* ==========================================================
   USE SCAN
   ========================================================== */

function useScan(){

  if(
    !capturedData
  ){

    showError(
      'No scanned ID is available.'
    );

    return;

  }


  if(
    window.opener
  ){

    window.opener.postMessage(

      {
        type:
          'STUDENT_ID_CAPTURED',

        image:
          capturedData

      },

      '*'

    );

  }


  instruction.textContent =
    'Student ID accepted. Returning...';


  stopCamera();


  setTimeout(
    function(){

      window.close();

    },
    600
  );

}


/* ==========================================================
   STOP CAMERA
   ========================================================== */

function stopCamera(){

  if(
    scanTimer
  ){

    clearTimeout(
      scanTimer
    );

    scanTimer =
      null;

  }


  if(
    stream
  ){

    stream
      .getTracks()
      .forEach(
        function(
          track
        ){

          track.stop();

        }
      );


    stream =
      null;

  }


  if(
    video
  ){

    video.srcObject =
      null;

  }

}


/* ==========================================================
   PARENT COMMUNICATION
   ========================================================== */

window.addEventListener(
  'load',
  function(){

    if(
      window.opener
    ){

      window.opener.postMessage(

        {
          type:
            'ID_CAMERA_READY'
        },

        '*'

      );

    }

  }
);


window.addEventListener(
  'message',
  function(event){

    if(
      !event.data
    ){

      return;

    }


    if(
      event.data.type ===
      'ID_CAMERA_INIT'
    ){

      status.textContent =
        'Scanner ready.';

    }

  }
);


/* ==========================================================
   BUTTONS
   ========================================================== */

window.retakeScan =
  retakeScan;


window.useScan =
  useScan;


/* ==========================================================
   INITIALIZE
   ========================================================== */

async function initialize(){

  /*
   * CAMERA FIRST.
   */

  try{

    await startCamera();

  }
  catch(error){

    console.error(
      error
    );

    instruction.textContent =
      'Camera could not start.';

    showError(
      error.message ||
      'Unable to access the camera.'
    );

    return;

  }


  /*
   * OPEN SCANNER AFTER CAMERA IS
   * ALREADY VISIBLE.
   */

  try{

    status.textContent =
      'Loading document scanner...';


    await loadOpenCV();


    status.textContent =
      'Document scanner ready.';


    beginScanning();

  }
  catch(error){

    console.error(
      'OpenCV error:',
      error
    );


    status.textContent =
      'Scanner could not load.';


    showError(
      'The document scanner library could not be loaded.'
    );

  }

}


window.addEventListener(
  'beforeunload',
  stopCamera
);


initialize();

</script>

</body>
</html>
