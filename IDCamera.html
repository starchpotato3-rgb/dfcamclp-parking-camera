<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Student ID Verification
</title>


<style>

*{
  box-sizing:border-box;
}


body{

  margin:0;

  min-height:100vh;

  padding:18px;

  background:#f4f7fb;

  font-family:Arial,sans-serif;

  color:#172033;

  display:flex;

  justify-content:center;

  align-items:center;

}


.card{

  width:100%;

  max-width:720px;

  background:white;

  border-radius:20px;

  padding:20px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.12);

  text-align:center;

}


h1{
  margin:0 0 8px;
}


.muted{
  color:#667085;
}


.camera-wrap{
  width:100%;
  max-width:420px;
  aspect-ratio:3/4;

  margin:20px auto;

  position:relative;

  overflow:hidden;

  border-radius:18px;

  background:#111827;

}


video,
canvas,
#capturedImage{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:cover;

}


video{
  display:block;
}


canvas{
  display:none;
}


#capturedImage{
  display:none;
}


/*
 * Physical school ID guide.
 */

.id-guide{
  width:72%;
  height:88%;

  transform:
    translate(-50%,-50%);

  border:
    3px solid white;

  border-radius:16px;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,.30);

  pointer-events:none;

  transition:
    border-color .2s ease;

}


.id-guide.ready{

  border-color:
    #22c55e;

}


.instruction{

  margin-top:10px;

  font-weight:800;

}


.check-list{

  display:grid;

  gap:8px;

  margin:
    16px 0;

  padding:14px;

  text-align:left;

  background:#f8fafc;

  border:
    1px solid #e5e7eb;

  border-radius:14px;

}


.check{

  display:flex;

  align-items:center;

  gap:9px;

  font-size:14px;

}


.check-icon{

  width:22px;

  height:22px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:0 0 auto;

  background:#e5e7eb;

  color:#667085;

  font-size:12px;

  font-weight:800;

}


.check.ok .check-icon{

  background:#dcfce7;

  color:#166534;

}


.check.bad .check-icon{

  background:#fee2e2;

  color:#991b1b;

}


.actions{

  display:flex;

  justify-content:center;

  gap:10px;

  flex-wrap:wrap;

}


button{

  border:0;

  border-radius:10px;

  padding:13px 20px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

}


button:disabled{

  opacity:.45;

  cursor:not-allowed;

}


.primary{

  background:#1d4ed8;

  color:white;

}


.secondary{

  background:#e5e7eb;

  color:#172033;

}


.success{

  background:#15803d;

  color:white;

}


.error{

  display:none;

  margin-top:14px;

  padding:12px;

  border-radius:10px;

  background:#fee2e2;

  color:#991b1b;

}


.status{

  margin-top:12px;

  font-size:13px;

  color:#667085;

  min-height:20px;

}


.ocr-box{

  display:none;

  margin-top:15px;

  text-align:left;

  padding:12px;

  background:#f8fafc;

  border:1px solid #e5e7eb;

  border-radius:10px;

  font-size:12px;

  max-height:120px;

  overflow:auto;

}

</style>

</head>


<body>


<div class="card">


<h1>
  Student ID Verification
</h1>


<p class="muted">

  Place your actual school ID inside the guide.

  Your name, Student ID number, and face must be visible.

</p>


<div class="camera-wrap">


  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <canvas
    id="canvas"
  ></canvas>


  <img
    id="capturedImage"
    alt="Captured student ID"
  >


  <div
    id="idGuide"
    class="id-guide"
  ></div>

</div>


<div
  id="instruction"
  class="instruction"
>
  Waiting for camera...
</div>


<div class="check-list">

<div
  id="checkCard"
  class="check bad"
>
  <span class="check-icon">!</span>

  <span>
    Physical Student ID detected
  </span>
</div>
  <div
    id="checkFace"
    class="check bad"
  >

    <span class="check-icon">!</span>

    <span>
      Student face visible
    </span>

  </div>


  <div
    id="checkLighting"
    class="check bad"
  >

    <span class="check-icon">!</span>

    <span>
      Sufficient lighting
    </span>

  </div>


  <div
    id="checkName"
    class="check bad"
  >

    <span class="check-icon">!</span>

    <span>
      Student name detected
    </span>

  </div>


  <div
    id="checkId"
    class="check bad"
  >

    <span class="check-icon">!</span>

    <span>
      Student ID number detected
    </span>

  </div>

</div>


<div class="actions">


  <button
    id="captureButton"
    class="primary"
    disabled
    onclick="captureID()"
  >
    Capture Student ID
  </button>


  <button
    id="retakeButton"
    class="secondary"
    style="display:none;"
    onclick="retakeID()"
  >
    Retake
  </button>


  <button
    id="useButton"
    class="success"
    style="display:none;"
    onclick="useID()"
  >
    Use This ID
  </button>

</div>


<div
  id="status"
  class="status"
></div>


<div
  id="ocrBox"
  class="ocr-box"
></div>


<div
  id="error"
  class="error"
></div>


</div>


<script
  src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
></script>
  <script
  async
  src="https://docs.opencv.org/4.x/opencv.js"
></script>


<script type="module">


import {

  FilesetResolver,

  FaceLandmarker

}

from

'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304';


let stream = null;

let faceLandmarker = null;

let animationFrameId = null;

let lastVideoTime = -1;

let expectedName = '';

let expectedStudentId = '';

let capturedData = null;

let currentCardDetected = false;
let currentFaceDetected = false;
let currentLightingOK = false;
let currentNameDetected = false;
let currentIdDetected = false;


const video =
  document.getElementById(
    'video'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const capturedImage =
  document.getElementById(
    'capturedImage'
  );


const idGuide =
  document.getElementById(
    'idGuide'
  );


const captureButton =
  document.getElementById(
    'captureButton'
  );


const retakeButton =
  document.getElementById(
    'retakeButton'
  );


const useButton =
  document.getElementById(
    'useButton'
  );


const instruction =
  document.getElementById(
    'instruction'
  );


const status =
  document.getElementById(
    'status'
  );


function showError(message){

  const el =
    document.getElementById(
      'error'
    );

  el.textContent =
    message;

  el.style.display =
    'block';

}


function clearError(){

  const el =
    document.getElementById(
      'error'
    );

  el.style.display =
    'none';

}


function setCheck(
  id,
  ok
){

  const element =
    document.getElementById(
      id
    );


  element.classList.toggle(
    'ok',
    ok
  );


  element.classList.toggle(
    'bad',
    !ok
  );


  element
    .querySelector(
      '.check-icon'
    )
    .textContent =
      ok
        ? '✓'
        : '!';

}


function updateLiveChecks(){

  setCheck(
    'checkCard',
    currentCardDetected
  );


  setCheck(
    'checkFace',
    currentFaceDetected
  );


  setCheck(
    'checkLighting',
    currentLightingOK
  );


  /*
   * Capture is NOT allowed just because
   * a face exists.
   *
   * The physical ID must also be detected.
   */

  const ready =
    currentCardDetected &&
    currentFaceDetected &&
    currentLightingOK;


  captureButton.disabled =
    !ready;


  idGuide.classList.toggle(
    'ready',
    ready
  );


  if(
    !currentCardDetected
  ){

    instruction.textContent =
      'Place your physical Student ID vertically inside the guide.';

  }

  else if(
    !currentFaceDetected
  ){

    instruction.textContent =
      'Make sure the face printed on the Student ID is clearly visible.';

  }

  else if(
    !currentLightingOK
  ){

    instruction.textContent =
      'Move to a brighter area so the ID can be clearly read.';

  }

  else{

    instruction.textContent =
      'Student ID detected. Keep it steady and capture the ID.';

  }

}


function normalizeText(text){

  return String(
    text || ''
  )
  .toUpperCase()
  .replace(
    /[^A-Z0-9\s]/g,
    ' '
  )
  .replace(
    /\s+/g,
    ' '
  )
  .trim();

}


function normalizeCompact(text){

  return normalizeText(
    text
  )
  .replace(
    /\s/g,
    ''
  );

}


function nameFound(
  text
){

  const ocr =
    normalizeText(
      text
    );


  const expected =
    normalizeText(
      expectedName
    );


  const tokens =
    expected
      .split(' ')
      .filter(
        token =>
          token.length >= 2
      );


  if(
    !tokens.length
  ){

    return false;

  }


  return tokens.every(
    token =>
      ocr.indexOf(
        token
      ) !== -1
  );

}


function studentIdFound(
  text
){

  const ocr =
    normalizeCompact(
      text
    );


  const expected =
    normalizeCompact(
      expectedStudentId
    );


  if(
    !expected
  ){

    return false;

  }


  return ocr.indexOf(
    expected
  ) !== -1;

}


function getLighting(){

  const c =
    document.createElement(
      'canvas'
    );


  c.width =
    60;

  c.height =
    60;


  const ctx =
    c.getContext(
      '2d'
    );


  ctx.drawImage(
    video,
    0,
    0,
    60,
    60
  );


  const pixels =
    ctx.getImageData(
      0,
      0,
      60,
      60
    ).data;


  let total =
    0;


  for(
    let i = 0;
    i < pixels.length;
    i += 4
  ){

    total +=
      (
        0.299 * pixels[i] +
        0.587 * pixels[i+1] +
        0.114 * pixels[i+2]
      );

  }


  return (
    total /
    (pixels.length / 4)
  ) >= 45;

}

function detectStudentIDCard(){

  if(
    typeof cv === 'undefined' ||
    !cv.Mat ||
    !video.videoWidth
  ){

    return false;

  }


  const source =
    new cv.Mat(
      video.videoHeight,
      video.videoWidth,
      cv.CV_8UC4
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext('2d');

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  source.data.set(
    imageData.data
  );


  const gray =
    new cv.Mat();


  const blurred =
    new cv.Mat();


  const edges =
    new cv.Mat();


  const contours =
    new cv.MatVector();


  const hierarchy =
    new cv.Mat();


  try{

    cv.cvtColor(
      source,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.GaussianBlur(
      gray,
      blurred,
      new cv.Size(5,5),
      0
    );


    cv.Canny(
      blurred,
      edges,
      50,
      150
    );


    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );


    const frameArea =
      video.videoWidth *
      video.videoHeight;


    let bestArea =
      0;


    let bestRatio =
      0;


    for(
      let i = 0;
      i < contours.size();
      i++
    ){

      const contour =
        contours.get(i);


      const perimeter =
        cv.arcLength(
          contour,
          true
        );


      const approx =
        new cv.Mat();


      cv.approxPolyDP(
        contour,
        approx,
        0.03 * perimeter,
        true
      );


      if(
        approx.rows === 4
      ){

        const rect =
          cv.boundingRect(
            approx
          );


        const area =
          rect.width *
          rect.height;


        const ratio =
          rect.width /
          rect.height;


        /*
         * We specifically want a
         * portrait/vertical card.
         */

        const verticalCard =
          ratio >= 0.45 &&
          ratio <= 0.85;


        const largeEnough =
          area >
          frameArea * 0.12;


        if(
          verticalCard &&
          largeEnough &&
          area > bestArea
        ){

          bestArea =
            area;

          bestRatio =
            ratio;

        }

      }


      approx.delete();

      contour.delete();

    }


    return (
      bestArea >
      frameArea * 0.12 &&
      bestRatio >= 0.45 &&
      bestRatio <= 0.85
    );

  }
  finally{

    source.delete();
    gray.delete();
    blurred.delete();
    edges.delete();
    contours.delete();
    hierarchy.delete();

  }

}
function processFrame(result){

  const faces =
    result.faceLandmarks || [];


  currentFaceDetected =
    faces.length === 1;


  currentLightingOK =
    getLighting();


  /*
   * Detect the actual physical ID card.
   */

  currentCardDetected =
    detectStudentIDCard();
function faceIsInsideCard(
  landmarks
){

  if(
    !landmarks ||
    !landmarks.length
  ){

    return false;

  }


  /*
   * Face center.
   */

  let totalX = 0;
  let totalY = 0;


  landmarks.forEach(
    function(point){

      totalX +=
        point.x;

      totalY +=
        point.y;

    }
  );


  const faceX =
    totalX /
    landmarks.length;


  const faceY =
    totalY /
    landmarks.length;


  /*
   * Approximate card location.
   *
   * This assumes the vertical ID is
   * held near the center of the
   * camera frame, matching the guide.
   */

  const cardLeft =
    0.20;

  const cardRight =
    0.80;

  const cardTop =
    0.08;

  const cardBottom =
    0.92;


  return (
    faceX >= cardLeft &&
    faceX <= cardRight &&
    faceY >= cardTop &&
    faceY <= cardBottom
  );

}

  /*
   * A face only counts if there is
   * also a detected ID card.
   */

  if(
    currentCardDetected &&
    currentFaceDetected
  ){

    currentFaceDetected =
      faceIsInsideCard(
        faces[0]
      );

  }
  else{

    currentFaceDetected =
      false;

  }


  updateLiveChecks();

}


async function initialize(){

  try{

    instruction.textContent =
      'Loading face detection...';


    const vision =
      await FilesetResolver.forVisionTasks(

        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm'

      );


    faceLandmarker =
      await FaceLandmarker.createFromOptions(

        vision,

        {

          baseOptions:{

            modelAssetPath:

              'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',

            delegate:
              'GPU'

          },

          runningMode:
            'VIDEO',

          numFaces:
            1,

          outputFaceBlendshapes:
            false

        }

      );


    await startCamera();

  }
  catch(error){

    console.error(
      error
    );

    showError(
      'Unable to initialize ID verification.'
    );

  }

}


async function startCamera(){

  try{

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:
              'user',

            width:{
              ideal:
                1280
            },

            height:{
              ideal:
                720
            }

          },

          audio:false

        });


    video.srcObject =
      stream;


    await video.play();


    instruction.textContent =
      'Position your face and Student ID inside the guide.';


    detect();

  }
  catch(error){

    console.error(
      error
    );

    showError(
      'Camera access was denied. Please allow camera access and refresh the page.'
    );

  }

}


function detect(){

  if(
    !faceLandmarker ||
    !video.videoWidth
  ){

    animationFrameId =
      requestAnimationFrame(
        detect
      );

    return;

  }


  if(
    video.currentTime !==
    lastVideoTime
  ){

    lastVideoTime =
      video.currentTime;


    const result =
      faceLandmarker.detectForVideo(
        video,
        performance.now()
      );


    processFrame(
  result
);

  }


  animationFrameId =
    requestAnimationFrame(
      detect
    );

}


async function captureID(){

  clearError();


  if(
    !currentFaceDetected ||
    !currentLightingOK
  ){

    showError(
      'Please make sure your face is visible and the lighting is sufficient.'
    );

    return;

  }


const sourceWidth =
  video.videoWidth;

const sourceHeight =
  video.videoHeight;

const targetHeight =
  sourceWidth * 4 / 3;

const cropHeight =
  Math.min(
    sourceHeight,
    targetHeight
  );

const cropWidth =
  cropHeight * 3 / 4;

const sourceX =
  (sourceWidth - cropWidth) / 2;

const sourceY =
  (sourceHeight - cropHeight) / 2;

canvas.width =
  cropWidth;

canvas.height =
  cropHeight;


  const ctx =
    canvas.getContext(
      '2d'
    );


 ctx.drawImage(

  video,

  sourceX,
  sourceY,

  cropWidth,
  cropHeight,

  0,
  0,

  cropWidth,
  cropHeight

);


  capturedData =
    canvas.toDataURL(
      'image/jpeg',
      0.92
    );


  capturedImage.src =
    capturedData;


  capturedImage.style.display =
    'block';


  video.style.display =
    'none';


  idGuide.style.display =
    'none';


  captureButton.style.display =
    'none';


  retakeButton.style.display =
    'inline-block';


  status.textContent =
    'Reading the Student ID...';


  currentNameDetected =
    false;


  currentIdDetected =
    false;


  setCheck(
    'checkName',
    false
  );


  setCheck(
    'checkId',
    false
  );


  useButton.style.display =
    'none';


  try{

    const worker =
      await Tesseract.createWorker(
        'eng',
        1
      );


    const result =
      await worker.recognize(
        capturedData
      );


    const text =
      result.data.text || '';


    await worker.terminate();


    currentNameDetected =
      nameFound(
        text
      );


    currentIdDetected =
      studentIdFound(
        text
      );


    setCheck(
      'checkName',
      currentNameDetected
    );


    setCheck(
      'checkId',
      currentIdDetected
    );


    const ocrBox =
      document.getElementById(
        'ocrBox'
      );


    ocrBox.textContent =
      text ||
      'No readable text detected.';


    ocrBox.style.display =
      'block';


    if(
      currentNameDetected &&
      currentIdDetected
    ){

      status.textContent =
        'Student ID verified. Review the photo before confirming.';

      useButton.style.display =
        'inline-block';

    }
    else{

      status.textContent =
        'Verification failed. Retake the photo with the name and Student ID clearly visible.';

      retakeButton.style.display =
        'inline-block';

    }

  }
  catch(error){

    console.error(
      error
    );

    status.textContent =
      'OCR could not read the Student ID. Please retake the photo.';

  }

}


function retakeID(){

  capturedData =
    null;


  currentNameDetected =
    false;

  currentIdDetected =
    false;


  capturedImage.style.display =
    'none';


  video.style.display =
    'block';


  idGuide.style.display =
    'block';


  captureButton.style.display =
    'inline-block';


  retakeButton.style.display =
    'none';


  useButton.style.display =
    'none';


  document.getElementById(
    'ocrBox'
  ).style.display =
    'none';


  status.textContent =
    '';


  setCheck(
    'checkName',
    false
  );


  setCheck(
    'checkId',
    false
  );


  updateLiveChecks();

}


function useID(){

  clearError();


  if(
    !capturedData ||
    !currentNameDetected ||
    !currentIdDetected
  ){

    showError(
      'The Student ID has not passed verification.'
    );

    return;

  }


  if(
    window.opener
  ){

    window.opener.postMessage(

      {

        type:
          'STUDENT_ID_CAPTURED',

        image:
          capturedData

      },

      '*'

    );

  }


  status.textContent =
    'Student ID verified successfully. Returning to the application...';


  stopCamera();


  setTimeout(
    function(){

      window.close();

    },
    700
  );

}


function stopCamera(){

  if(
    animationFrameId
  ){

    cancelAnimationFrame(
      animationFrameId
    );

    animationFrameId =
      null;

  }


  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream =
      null;

  }

}


/*
 * Tell the parent that the camera page is ready.
 */

window.addEventListener(
  'load',
  function(){

    if(
      window.opener
    ){

      window.opener.postMessage(

        {
          type:
            'ID_CAMERA_READY'
        },

        '*'

      );

    }

  }
);


/*
 * Receive student name + ID from
 * the main application.
 */

window.addEventListener(
  'message',
  function(event){

    if(
      !event.data
    ){

      return;

    }


    if(
      event.data.type ===
      'ID_CAMERA_INIT'
    ){

      expectedName =
        String(
          event.data.studentName ||
          ''
        ).trim();


      expectedStudentId =
        String(
          event.data.studentId ||
          ''
        ).trim();


      status.textContent =
        'Verification is checking for the entered name and Student ID number.';

    }

  },
  false
);


initialize();

</script>

</body>

</html>
