<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Student ID Camera</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:18px;

  background:#f4f7fb;

  font-family:Arial,sans-serif;

  color:#172033;

  display:flex;
  justify-content:center;
  align-items:center;
}

.card{

  width:100%;

  max-width:620px;

  background:#fff;

  border-radius:20px;

  padding:20px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.12);

  text-align:center;

}

h1{

  margin:
    0 0 8px;

}

.muted{

  color:#667085;

  font-size:14px;

  line-height:1.5;

}


/* ==========================================================
   CAMERA
   ========================================================== */

.camera-wrap{

  position:relative;

  width:100%;

  max-width:420px;

  aspect-ratio:3 / 4;

  margin:20px auto;

  overflow:hidden;

  border-radius:18px;

  background:#111827;

}

#video{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}

#capturedImage{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:contain;

  background:#111827;

  display:none;

}


/* ==========================================================
   CENTER GUIDE
   ========================================================== */

#guide{

  position:absolute;

  left:50%;

  top:50%;

  width:70%;

  aspect-ratio:3 / 4;

  transform:
    translate(-50%,-50%);

  border:
    3px solid rgba(
      255,
      255,
      255,
      .95
    );

  border-radius:14px;

  pointer-events:none;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,.30);

}


/* GUIDE CORNERS */

.corner{

  position:absolute;

  width:26px;

  height:26px;

  border:
    4px solid white;

}

.corner.tl{

  top:-3px;

  left:-3px;

  border-right:0;

  border-bottom:0;

  border-radius:
    8px 0 0 0;

}

.corner.tr{

  top:-3px;

  right:-3px;

  border-left:0;

  border-bottom:0;

  border-radius:
    0 8px 0 0;

}

.corner.bl{

  bottom:-3px;

  left:-3px;

  border-right:0;

  border-top:0;

  border-radius:
    0 0 0 8px;

}

.corner.br{

  bottom:-3px;

  right:-3px;

  border-left:0;

  border-top:0;

  border-radius:
    0 0 8px 0;

}


/* ==========================================================
   TEXT
   ========================================================== */

#instruction{

  margin-top:10px;

  font-size:15px;

  font-weight:800;

}

#status{

  margin-top:7px;

  min-height:20px;

  font-size:13px;

  color:#667085;

}


/* ==========================================================
   BUTTONS
   ========================================================== */

.actions{

  display:flex;

  justify-content:center;

  gap:10px;

  flex-wrap:wrap;

  margin-top:16px;

}

button{

  border:0;

  border-radius:10px;

  padding:13px 20px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

}

button:disabled{

  opacity:.45;

  cursor:not-allowed;

}

.primary{

  background:#1d4ed8;

  color:#fff;

}

.secondary{

  background:#e5e7eb;

  color:#172033;

}

.success{

  background:#15803d;

  color:#fff;

}


/* ==========================================================
   ERROR
   ========================================================== */

#error{

  display:none;

  margin-top:14px;

  padding:12px;

  border-radius:10px;

  background:#fee2e2;

  color:#991b1b;

  font-size:14px;

}


/* ==========================================================
   RESULT
   ========================================================== */

#reviewText{

  display:none;

  margin-top:12px;

  padding:10px;

  border-radius:10px;

  background:#dcfce7;

  color:#166534;

  font-size:13px;

  font-weight:700;

}

</style>

</head>


<body>


<div class="card">


<h1>
  Student ID Camera
</h1>


<p class="muted">

  Place your physical Student ID or school card
  inside the guide and take a clear photo.

</p>


<div class="camera-wrap">


  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <img
    id="capturedImage"
    alt="Captured Student ID"
  >


  <div
    id="guide"
  >

    <span class="corner tl"></span>

    <span class="corner tr"></span>

    <span class="corner bl"></span>

    <span class="corner br"></span>

  </div>

</div>


<div
  id="instruction"
>
  Starting camera...
</div>


<div
  id="status"
>
  Allow camera access when your browser asks.
</div>


<div
  id="reviewText"
>
  Photo captured. Review it before continuing.
</div>


<div class="actions">


  <button
    id="takeButton"
    class="primary"
    onclick="takePhoto()"
  >
    Take Photo
  </button>


  <button
    id="retakeButton"
    class="secondary"
    style="display:none;"
    onclick="retakePhoto()"
  >
    Retake
  </button>


  <button
    id="useButton"
    class="success"
    style="display:none;"
    onclick="usePhoto()"
  >
    Use This ID
  </button>

</div>


<div
  id="error"
></div>


</div>


<script>


/* ==========================================================
   VARIABLES
   ========================================================== */

let stream =
  null;

let capturedData =
  null;


/* ==========================================================
   ELEMENTS
   ========================================================== */

const video =
  document.getElementById(
    'video'
  );


const capturedImage =
  document.getElementById(
    'capturedImage'
  );


const guide =
  document.getElementById(
    'guide'
  );


const instruction =
  document.getElementById(
    'instruction'
  );


const status =
  document.getElementById(
    'status'
  );


const takeButton =
  document.getElementById(
    'takeButton'
  );


const retakeButton =
  document.getElementById(
    'retakeButton'
  );


const useButton =
  document.getElementById(
    'useButton'
  );


const reviewText =
  document.getElementById(
    'reviewText'
  );


const errorBox =
  document.getElementById(
    'error'
  );


/* ==========================================================
   ERROR
   ========================================================== */

function showError(
  message
){

  errorBox.textContent =
    message;

  errorBox.style.display =
    'block';

}


function clearError(){

  errorBox.textContent =
    '';

  errorBox.style.display =
    'none';

}


/* ==========================================================
   START CAMERA
   ========================================================== */

async function startCamera(){

  clearError();


  instruction.textContent =
    'Requesting camera access...';


  try{

    /*
     * Prefer rear camera on phone.
     */

    try{

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{

              facingMode:{
                ideal:
                  'environment'
              },

              width:{
                ideal:
                  1280
              },

              height:{
                ideal:
                  720
              }

            },

            audio:false

          });

    }
    catch(firstError){

      /*
       * Laptop fallback.
       */

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{

              width:{
                ideal:
                  640
              },

              height:{
                ideal:
                  480
              }

            },

            audio:false

          });

    }


    video.srcObject =
      stream;


    await video.play();


    instruction.textContent =
      'Position your Student ID inside the guide.';


    status.textContent =
      'Make sure the entire card is visible before taking the photo.';

  }
  catch(error){

    console.error(
      'Camera error:',
      error
    );


    instruction.textContent =
      'Camera could not start.';


    showError(
      'Camera access failed. Please allow camera permission and refresh this page.'
    );

  }

}


/* ==========================================================
   TAKE PHOTO
   ========================================================== */

function takePhoto(){

  clearError();


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    showError(
      'The camera is not ready yet.'
    );

    return;

  }


  /*
   * ========================================================
   * CAPTURE THE AREA INSIDE THE GUIDE
   *
   * This produces a vertical image.
   * ========================================================
   */

  const videoWidth =
    video.videoWidth;


  const videoHeight =
    video.videoHeight;


  /*
   * The guide is 70% wide
   * and 3:4 portrait.
   */

  const cropWidth =
    Math.round(
      videoWidth * 0.70
    );


  const cropHeight =
    Math.round(
      cropWidth * 4 / 3
    );


  /*
   * Make sure the crop fits the
   * actual camera frame.
   */

  const finalWidth =
    Math.min(
      cropWidth,
      videoWidth
    );


  const finalHeight =
    Math.min(
      cropHeight,
      videoHeight
    );


  const cropX =
    Math.round(
      (
        videoWidth -
        finalWidth
      ) / 2
    );


  const cropY =
    Math.round(
      (
        videoHeight -
        finalHeight
      ) / 2
    );


  /*
   * Create canvas.
   */

  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    finalWidth;


  canvas.height =
    finalHeight;


  const context =
    canvas.getContext(
      '2d'
    );


  /*
   * Capture the centered guide area.
   */

  context.drawImage(

    video,

    cropX,
    cropY,

    finalWidth,
    finalHeight,

    0,
    0,

    finalWidth,
    finalHeight

  );


  /*
   * Convert to JPEG.
   */

  capturedData =
    canvas.toDataURL(
      'image/jpeg',
      0.95
    );


  /*
   * Show review.
   */

  capturedImage.src =
    capturedData;


  capturedImage.style.display =
    'block';


  video.style.display =
    'none';


  guide.style.display =
    'none';


  takeButton.style.display =
    'none';


  retakeButton.style.display =
    'inline-block';


  useButton.style.display =
    'inline-block';


  reviewText.style.display =
    'block';


  instruction.textContent =
    'Review your Student ID photo.';


  status.textContent =
    'Choose Retake or Use This ID.';


  stopCamera();

}


/* ==========================================================
   RETAKE
   ========================================================== */

async function retakePhoto(){

  capturedData =
    null;


  clearError();


  capturedImage.src =
    '';


  capturedImage.style.display =
    'none';


  video.style.display =
    'block';


  guide.style.display =
    'block';


  takeButton.style.display =
    'inline-block';


  retakeButton.style.display =
    'none';


  useButton.style.display =
    'none';


  reviewText.style.display =
    'none';


  instruction.textContent =
    'Starting camera...';


  status.textContent =
    'Position your Student ID inside the guide.';


  await startCamera();

}


/* ==========================================================
   USE PHOTO
   ========================================================== */

function usePhoto(){

  clearError();


  if(
    !capturedData
  ){

    showError(
      'Please take a photo first.'
    );

    return;

  }


  /*
   * Send captured image back
   * to the main application.
   */

  if(
    window.opener
  ){

    window.opener.postMessage(

      {

        type:
          'STUDENT_ID_CAPTURED',

        image:
          capturedData

      },

      '*'

    );

  }


  instruction.textContent =
    'Student ID accepted. Returning to the application...';


  status.textContent =
    '';


  stopCamera();


  setTimeout(
    function(){

      window.close();

    },
    600
  );

}


/* ==========================================================
   STOP CAMERA
   ========================================================== */

function stopCamera(){

  if(
    stream
  ){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );


    stream =
      null;

  }


  video.srcObject =
    null;

}


/* ==========================================================
   PARENT COMMUNICATION
   ========================================================== */

window.addEventListener(
  'load',
  function(){

    if(
      window.opener
    ){

      window.opener.postMessage(

        {

          type:
            'ID_CAMERA_READY'

        },

        '*'

      );

    }

  }
);


window.addEventListener(
  'message',
  function(event){

    if(
      !event.data
    ){

      return;

    }


    if(
      event.data.type ===
      'ID_CAMERA_INIT'
    ){

      status.textContent =
        'Camera ready.';

    }

  }
);


/* ==========================================================
   BUTTON FUNCTIONS
   ========================================================== */

window.takePhoto =
  takePhoto;


window.retakePhoto =
  retakePhoto;


window.usePhoto =
  usePhoto;


/* ==========================================================
   CLEANUP
   ========================================================== */

window.addEventListener(
  'beforeunload',
  stopCamera
);


/* ==========================================================
   START
   ========================================================== */

startCamera();

</script>

</body>

</html>
